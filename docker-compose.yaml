services:
  db:
    image: mysql:8
    container_name: eventflow-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eventflow
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./server
    container_name: eventflow-backend
    restart: always
    depends_on:
      - db
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/.next
      - /app/node_modules

  client:
    build: ./client
    container_name: eventflow-client
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  db_data:
